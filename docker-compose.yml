version: "3.9"

services:
  backend:
    container_name: referral-backend
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    ports:
      - "5000:5000"
    volumes:
      - ./server/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    container_name: referral-frontend
    build:
      context: ./next-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_HOST: ${NEXT_PUBLIC_HOST}
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
      - NEXT_PUBLIC_HOST=${NEXT_PUBLIC_HOST}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

