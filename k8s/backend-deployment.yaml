apiVersion: apps/v1
kind: Deployment
metadata:
  name: refoza-backend
  namespace: refoza
spec:
  replicas: 1
  selector:
    matchLabels:
      app: refoza-backend
  template:
    metadata:
      labels:
        app: refoza-backend
    spec:
      serviceAccountName: refoza-backend-sa
      containers:
        - name: backend
          image: us-west1-docker.pkg.dev/refoza/refoza/backend:v48
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: refoza-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: refoza-config
                  key: PORT
            - name: HOST_BASE
              valueFrom:
                configMapKeyRef:
                  name: refoza-config
                  key: HOST_BASE
            - name: CLIENT_URL_BASE
              valueFrom:
                configMapKeyRef:
                  name: refoza-config
                  key: CLIENT_URL_BASE
            - name: CLIENT_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: refoza-config
                  key: CLIENT_PROTOCOL
            - name: CLIENT_PORT
              valueFrom:
                configMapKeyRef:
                  name: refoza-config
                  key: CLIENT_PORT
            - name: CORS_DOMAIN_SUFFIX
              valueFrom:
                configMapKeyRef:
                  name: refoza-config
                  key: CORS_DOMAIN_SUFFIX
            - name: DB_HOST
              value: "127.0.0.1"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: refoza-secrets
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: refoza-secrets
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: refoza-secrets
                  key: DB_PASS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: refoza-secrets
                  key: JWT_SECRET
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: refoza-secrets
                  key: SENDGRID_API_KEY
            - name: SENDGRID_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: refoza-secrets
                  key: SENDGRID_FROM_EMAIL
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: refoza-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_PRICE_ID
              valueFrom:
                secretKeyRef:
                  name: refoza-secrets
                  key: STRIPE_PRICE_ID
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: refoza-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: STRIPE_SUCCESS_URL
              valueFrom:
                secretKeyRef:
                  name: refoza-secrets
                  key: STRIPE_SUCCESS_URL
            - name: STRIPE_CANCEL_URL
              valueFrom:
                secretKeyRef:
                  name: refoza-secrets
                  key: STRIPE_CANCEL_URL
            - name: STRIPE_PORTAL_RETURN_URL
              valueFrom:
                secretKeyRef:
                  name: refoza-secrets
                  key: STRIPE_PORTAL_RETURN_URL
            - name: STRIPE_TAX_ENABLED
              valueFrom:
                secretKeyRef:
                  name: refoza-secrets
                  key: STRIPE_TAX_ENABLED
            - name: GCS_BUCKET_MEDIA
              valueFrom:
                secretKeyRef:
                  name: refoza-secrets
                  key: GCS_BUCKET_MEDIA
            - name: GCS_PUBLIC_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: refoza-secrets
                  key: GCS_PUBLIC_BASE_URL
            - name: GCS_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: refoza-secrets
                  key: GCS_PROJECT_ID
            - name: GCS_SIGNED_URL_EXPIRY
              valueFrom:
                secretKeyRef:
                  name: refoza-secrets
                  key: GCS_SIGNED_URL_EXPIRY
            - name: PUBLIC_SITE_URL
              valueFrom:
                secretKeyRef:
                  name: refoza-secrets
                  key: PUBLIC_SITE_URL
            - name: BILLING_SITE_URL
              valueFrom:
                configMapKeyRef:
                  name: refoza-config
                  key: BILLING_SITE_URL
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
        - name: cloudsql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.2
          args:
            - "--port=5432"
            - "$(CLOUDSQL_INSTANCE_CONNECTION_NAME)"
          env:
            - name: CLOUDSQL_INSTANCE_CONNECTION_NAME
              valueFrom:
                secretKeyRef:
                  name: refoza-secrets
                  key: CLOUDSQL_INSTANCE_CONNECTION_NAME
