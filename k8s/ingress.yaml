apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: refoza-ingress
  namespace: refoza
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-dns
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - refoza.com
        - www.refoza.com
        - "*.tenant.refoza.com"
        - subscription.refoza.com
      secretName: refoza-tls
  rules:
    - host: refoza.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: refoza-backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: refoza-frontend
                port:
                  number: 3000
    - host: www.refoza.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: refoza-backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: refoza-frontend
                port:
                  number: 3000
    - host: "*.tenant.refoza.com"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: refoza-backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: refoza-frontend
                port:
                  number: 3000
    - host: subscription.refoza.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: refoza-backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: refoza-frontend
                port:
                  number: 3000
